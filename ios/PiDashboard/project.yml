name: PiDashboard
options:
  bundleIdPrefix: technology.blackbelt.pidashboard
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  PiDashboardKit:
    path: ../PiDashboardKit
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.0"

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "ZPD66G9CB6"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"

targets:
  PiDashboard:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    dependencies:
      - package: PiDashboardKit
        product: PiDashboardKit
      - package: MarkdownUI
        product: MarkdownUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: technology.blackbelt.pidashboard
        PRODUCT_NAME: PiDashboard
        INFOPLIST_KEY_CFBundleDisplayName: "pi dashboard"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: "pi dashboard"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: "Attach photos from your library to a pi session message."
        NSMicrophoneUsageDescription: "Record voice to dictate a message to your pi session."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true

  PiDashboardUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
      - path: ../qa-e2e/PiDashboardUITests
    dependencies:
      - target: PiDashboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: technology.blackbelt.pidashboard.uitests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  PiDashboard:
    build:
      targets:
        PiDashboard: all
        PiDashboardUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PiDashboardUITests

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>PI Dashboard</title>
    <script>
      /* Pre-paint skin boot: set data-skin and inject the editorial webfonts
         before React hydrates, so the first paint already wears the right skin
         (no flash of legacy → editorial). Mirrors the localStorage contract in
         hooks/useSkin.ts. Legacy never injects fonts. */
      (function () {
        try {
          var skin = localStorage.getItem("dashboard:skin");
          if (skin !== "editorial" && skin !== "legacy") skin = "editorial";
          document.documentElement.setAttribute("data-skin", skin);
          if (skin === "editorial") {
            var pre1 = document.createElement("link");
            pre1.id = "editorial-fonts-pre1";
            pre1.rel = "preconnect";
            pre1.href = "https://fonts.googleapis.com";
            var pre2 = document.createElement("link");
            pre2.id = "editorial-fonts-pre2";
            pre2.rel = "preconnect";
            pre2.href = "https://fonts.gstatic.com";
            pre2.crossOrigin = "anonymous";
            var sheet = document.createElement("link");
            sheet.id = "editorial-fonts";
            sheet.rel = "stylesheet";
            sheet.href =
              "https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap";
            document.head.appendChild(pre1);
            document.head.appendChild(pre2);
            document.head.appendChild(sheet);
          }
        } catch (e) {
          document.documentElement.setAttribute("data-skin", "editorial");
        }
      })();
    </script>
    <style>
      /* App-shell skeleton — paints before React hydrates.
         React 19 createRoot().render() replaces #root children atomically
         on hydration (no race; no flicker if hydration < 500ms).
         See cell dashboard-pwa-cold-load-fix/v1 outcome contract clause (a). */
      html, body {
        margin: 0;
        padding: 0;
        background: #0f172a; /* manifest.json background_color */
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
        min-height: 100dvh; /* iOS Safari dynamic-viewport */
      }
      .pi-skeleton {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
      .pi-skeleton__logo {
        width: 96px;
        height: 96px;
        border-radius: 20px;
        opacity: 0.95;
      }
      .pi-skeleton__text {
        font-size: 0.95rem;
        font-weight: 500;
        color: #94a3b8;
        letter-spacing: 0.01em;
      }
      .pi-skeleton__spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(59, 130, 246, 0.25);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: pi-spin 0.9s linear infinite;
      }
      @keyframes pi-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .pi-skeleton__spinner { animation-duration: 2.4s; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="pi-skeleton" aria-busy="true" aria-live="polite" role="status">
        <img class="pi-skeleton__logo" src="/icon-192.png" alt="PI Dashboard" />
        <div class="pi-skeleton__spinner" aria-hidden="true"></div>
        <div class="pi-skeleton__text">Loading PI Dashboard…</div>
      </div>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>

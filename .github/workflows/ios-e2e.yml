name: iOS E2E

# Runs native-iOS regression checks on a GitHub-hosted macOS runner, OFF the
# operator's working machine. A focused rendering smoke suite gates branch pushes
# and pull requests; the full XCUITest suite remains nightly + on-demand.
# Every iOS-branch push gets a result; other pull requests stay iOS-path scoped.

on:
  push:
    branches: [feat/native-ios-tests]
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-e2e.yml'
  schedule:
    - cron: '0 5 * * *'   # nightly 05:00 UTC — full E2E on a dedicated runner, off every-push
  workflow_dispatch:

concurrency:
  group: ios-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests (Swift + real-store harness)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || echo /Applications/Xcode.app)"
          xcodebuild -version
          swift --version
      - name: swift test (PiDashboardKit)
        working-directory: ios/PiDashboardKit
        run: swift test
      - name: Real-store credential and reconnect harness
        working-directory: ios/Tools/ws-fault-harness
        run: |
          ./run-reconnect-check.sh cross-origin
          ./run-reconnect-check.sh auth-reject
          ./run-reconnect-check.sh close
          ./run-reconnect-check.sh stall
          ./run-reconnect-check.sh revalidate-idle
          ./run-reconnect-check.sh revalidate-halfopen

  e2e-smoke:
    name: E2E smoke gate (critical rendering)
    runs-on: macos-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    # Eight exact rendering tests. Expected ~10-15min on a cold hosted runner;
    # 20min keeps infrastructure stalls bounded without masking a red test.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || echo /Applications/Xcode.app)"
          xcodebuild -version
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios/PiDashboard
        run: xcodegen generate
      - name: Pick a simulator
        run: |
          echo "Available iPhone simulators:"
          xcrun simctl list devices available | grep -i iPhone || true
          NAME=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+' | sort -V | uniq | tail -1)
          if [ -z "$NAME" ]; then echo "No iPhone simulator found" >&2; exit 1; fi
          echo "SIM_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Selected simulator: $NAME"
      - name: xcodebuild smoke test
        working-directory: ios/PiDashboard
        run: |
          set -o pipefail
          xcodebuild test \
            -project PiDashboard.xcodeproj \
            -scheme PiDashboard \
            -destination "platform=iOS Simulator,name=${SIM_NAME}" \
            -resultBundlePath SmokeTestResults.xcresult \
            -only-testing:PiDashboardUITests/ConnectAndListUITests/testF2_ListShowsTiersAndCardFields \
            -only-testing:PiDashboardUITests/SessionDeclutterUITests/testHideEndedSearchRevealsMatchAndClearingRehides \
            -only-testing:PiDashboardUITests/SessionDeclutterUITests/testEndedVisibleWhenHideEndedForcedOff \
            -only-testing:PiDashboardUITests/TierRowCorrespondenceUITests/testCardsRenderUnderTheirOwnTierHeaderWithFoldersOff \
            -only-testing:PiDashboardUITests/ComposerUITests/testF4_ComposerHysteresisSingleRowMultilineRevert \
            -only-testing:PiDashboardUITests/ComposerFocusUITests/testProgrammaticLongLineSeedFlipsToMultiline \
            -only-testing:PiDashboardUITests/ModelPickerUITests/testSelectingModelRowUpdatesSession \
            -only-testing:PiDashboardUITests/AccessibilityUITests/testStatusHasNonColorSpokenLabel \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload smoke result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-smoke-xcresult
          path: ios/PiDashboard/SmokeTestResults.xcresult
          if-no-files-found: ignore

  e2e:
    name: E2E full suite (nightly/manual)
    runs-on: macos-latest
    # Full XCUITest suite is ~40min+ on GitHub's macOS runner (~2x local box, serial run).
    # Keep it nightly + on-demand; the focused rendering suite is the every-push gate.
    # 55min gives headroom over the ~40min slow-runner wall time.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || echo /Applications/Xcode.app)"
          xcodebuild -version
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios/PiDashboard
        run: xcodegen generate
      - name: Pick a simulator
        run: |
          echo "Available iPhone simulators:"
          xcrun simctl list devices available | grep -i iPhone || true
          NAME=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+' | sort -V | uniq | tail -1)
          if [ -z "$NAME" ]; then echo "No iPhone simulator found" >&2; exit 1; fi
          echo "SIM_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Selected simulator: $NAME"
      - name: xcodebuild test
        working-directory: ios/PiDashboard
        run: |
          set -o pipefail
          xcodebuild test \
            -project PiDashboard.xcodeproj \
            -scheme PiDashboard \
            -destination "platform=iOS Simulator,name=${SIM_NAME}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-xcresult
          path: ios/PiDashboard/TestResults.xcresult
          if-no-files-found: ignore

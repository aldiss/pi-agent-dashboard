name: iOS E2E

# Runs the native-iOS regression suite on a GitHub-hosted macOS runner, OFF the
# operator's working machine. Core unit tests (swift test) + the full XCUITest
# simulator suite (the ~500-CPU-load cold compile is fine on a dedicated runner).
# Only fires on the iOS branch / iOS path changes — never touches the web CI.

on:
  push:
    branches: [feat/native-ios-tests]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-e2e.yml'
  pull_request:
    paths:
      - 'ios/**'
  workflow_dispatch:

concurrency:
  group: ios-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core unit tests (swift test)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || echo /Applications/Xcode.app)"
          xcodebuild -version
          swift --version
      - name: swift test (PiDashboardKit)
        working-directory: ios/PiDashboardKit
        run: swift test

  e2e:
    name: E2E XCUITest (simulator)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || echo /Applications/Xcode.app)"
          xcodebuild -version
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios/PiDashboard
        run: xcodegen generate
      - name: Pick a simulator
        run: |
          echo "Available iPhone simulators:"
          xcrun simctl list devices available | grep -i iPhone || true
          NAME=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+' | sort -V | uniq | tail -1)
          if [ -z "$NAME" ]; then echo "No iPhone simulator found" >&2; exit 1; fi
          echo "SIM_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Selected simulator: $NAME"
      - name: xcodebuild test
        working-directory: ios/PiDashboard
        run: |
          set -o pipefail
          xcodebuild test \
            -project PiDashboard.xcodeproj \
            -scheme PiDashboard \
            -destination "platform=iOS Simulator,name=${SIM_NAME}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-xcresult
          path: ios/PiDashboard/TestResults.xcresult
          if-no-files-found: ignore
